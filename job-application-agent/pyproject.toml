[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-agent"
version = "0.1.0"
description = "Review-first job discovery, scoring, tracking, and application automation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "playwright>=1.46",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]